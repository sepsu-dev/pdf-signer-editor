    <circle cx="1" cy="31" r="1.5" fill="#09090b" />

    <!-- Cincin Metal Silver (Ferrule #94a3b8) -->
    <polygon points="19,8 24,13 26,11 21,6" fill="#cbd5e1" stroke="#475569" stroke-width="1" />

    <!-- Penghapus Pensil Pink (#f43f5e) -->
